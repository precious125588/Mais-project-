# railway.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# server.js binds $PORT, serves /api/health (used by the healthcheck below),
# spawns the bot launcher and auto-loads paired sessions. It never prompts
# for a terminal password, so it runs unattended on Railway.
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[volumes]]
mountPath = "/app/nexstore"
